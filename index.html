<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BERI home, dark street</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;family=Permanent+Marker&amp;display=swap">
<style>
@font-face{font-family:"GraffitiBomb Fill";src:url("assets/blob/973be0322be6aff5ecd840094128f0bb.ttf") format("truetype");font-display:swap}
@font-face{font-family:"GraffitiBomb Outline";src:url("assets/blob/0ca31839f8404f38e272b3a42bac8ab3.ttf") format("truetype");font-display:swap}
.tag-draw path{stroke-dasharray:1;stroke-dashoffset:1}
.tag-draw.is-drawn path{animation:tagDraw .45s cubic-bezier(.5,0,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes tagDraw{to{stroke-dashoffset:0}}
.slap{position:absolute;z-index:3;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:3px solid #0B0B0D;box-shadow:0 0 0 4px #F4F1EA,5px 8px 12px rgba(0,0,0,.5);font-family:var(--display);color:#0B0B0D;letter-spacing:.04em;line-height:1;white-space:nowrap;pointer-events:none}
.marker{font-family:'Permanent Marker','Anton',cursive}
:root{--ink:#0B0B0D;--fg:#F4F1EA;--mute:#ABA69C;--paper:#EFE6D6;--display:'Anton',Impact,sans-serif;--tag-fill:'GraffitiBomb Fill','Anton',Impact,sans-serif;--body:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
body{margin:0;background:#0B0B0D}
a{color:#F4F1EA}a:hover{color:#22C3F0}
.wall{position:relative;isolation:isolate;background-color:#101012;background-image:linear-gradient(rgba(11,11,13,.78),rgba(11,11,13,.86)),url("assets/blob/def4eaa24c6d3dcb6e6e11f58f1ea990.webp");background-size:cover;background-position:center}
.wall::before{content:"";position:absolute;inset:0;z-index:-1;background-image:url("assets/blob/f3b063545c55864824826123cf2c73c4.png");background-size:330px 210px;opacity:.05;pointer-events:none}
.grain{background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.04) 1px,transparent 1.3px);background-size:5px 5px,9px 9px;background-position:0 0,2px 3px}
.street-link{position:relative;color:#F4F1EA;text-decoration:none}
.street-link::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:3px;background:#22C3F0;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.street-link:hover{color:#F4F1EA}.street-link:hover::after,.street-link.is-current::after{transform:scaleX(1)}
.top-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.top-nav>a:first-child{justify-self:start}
.nav-pill{justify-self:center;display:flex;align-items:center;gap:2px;padding:6px 6px 6px 14px;background:rgba(255,214,0,.16);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,214,0,.55);border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,240,150,.25);font-family:var(--body);font-size:15px;font-weight:500;white-space:nowrap}
.pill-link{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;color:#F4F1EA;text-decoration:none;transition:background .2s ease,color .2s ease}
.pill-link:hover{background:rgba(255,214,0,.18);color:#FFFFFF}
.pill-link.is-current{color:#FFD600;font-weight:700}
.pill-cta{display:inline-flex;align-items:center;min-height:44px;margin-left:8px;padding:0 22px;border-radius:999px;background:#FFD600;color:#0B0B0D;font-weight:700;text-decoration:none;transition:background .2s ease,color .2s ease}
.pill-cta:hover{background:#22C3F0;color:#0B0B0D}
@keyframes flick{0%,18%,22%,52%,56%,100%{opacity:1}20%,54%{opacity:.45}}
.flick{animation:flick 6s linear infinite}
@keyframes tapeL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape-l{animation:tapeL 40s linear infinite}
@keyframes tapeR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.tape-r{animation:tapeR 60s linear infinite}
.btn-solid{transition:background .2s ease}
.btn-solid:hover{background:#22C3F0;color:#0B0B0D}
.btn-ghost{transition:background .2s ease,color .2s ease}
.btn-ghost:hover{background:#F4F1EA;color:#0B0B0D}
.hero-tear{display:block}
.tear-print::before{content:"";position:absolute;inset:0;background-image:url("assets/blob/f3b063545c55864824826123cf2c73c4.png");background-size:220px 140px;opacity:.14;mix-blend-mode:multiply}
.tear-print::after,.paper-tex::after{content:"";position:absolute;inset:0;background-image:url("assets/blob/fff9cae5995094b6ce16f5ea41bbfe03.webp");background-size:cover;background-position:center;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.pick-btn{transition:transform .2s var(--ease),background .2s ease,color .2s ease}
.pick-btn:hover{transform:translateY(-3px)}
@keyframes matchIn{from{opacity:0;transform:translateY(18px) rotate(var(--r,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
.match-dev{animation:matchIn .5s var(--ease) both}
.match-cta{transition:background .2s ease,color .2s ease}
.match-cta:hover{background:#F4F1EA;color:#0B0B0D}
.cmp-row{transition:background .2s ease}
.cmp-row:hover{background:#1C1C21}
.mood-btn{transition:background .2s ease,color .2s ease,border-color .2s ease}
.mood-btn:hover{border-color:#F4F1EA}
.sticker{transition:transform .3s var(--ease)}
.sticker:hover{transform:rotate(0deg) translateY(-6px) !important;z-index:2}
.ws-input{transition:box-shadow .2s ease}
.ws-input:focus{outline:none;box-shadow:4px 4px 0 #0B0B0D}
.ws-send{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.ws-send:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #FFD600}
.match-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
.cmp-grid{display:grid;grid-template-columns:22% repeat(3,minmax(0,1fr));align-items:center}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:899px){.top-nav{grid-template-columns:auto minmax(0,1fr);padding:0 16px !important}.nav-pill{justify-self:end;min-width:0;max-width:100%;padding-right:0 !important;overflow-x:auto;scrollbar-width:none;padding-left:8px}.pill-link{padding:0 10px;font-size:14px}.pill-cta{padding:0 16px;position:sticky;right:0;box-shadow:none}.hero-tear{display:none}.hero-head{font-size:68px !important}.wall-head{font-size:64px !important}.neon-head{font-size:60px !important}.stock-head{font-size:110px !important}.match-grid{grid-template-columns:minmax(0,1fr)}.match-name{font-size:110px !important}.match-img{height:340px !important}.steps{grid-template-columns:minmax(0,1fr)}.foot-wall{height:280px !important}.pick-cans{width:170px !important}.pod-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:24px 16px !important}.tag-wrap{width:190px !important;left:150px !important;top:30px !important}.ghost-name{font-size:170px !important}.hero-note{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.flick,.tape-l,.tape-r,.match-dev{animation:none}.tag-draw path{stroke-dashoffset:0;animation:none}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="background: #0B0B0D; color: #F4F1EA; font-family: var(--body); font-size: 16px; line-height: 1.6">

<div style="position: sticky; top: 0; z-index: 50">
<div style="background: #FFFFFF; color: #000000; text-align: center; font-weight: 700; font-size: 15px; padding: 8px 16px; line-height: 1.35">WARNING: This product contains nicotine. Nicotine is an addictive chemical.</div>
<header style="{{navStyle}}">
<nav class="top-nav" style="max-width: 1320px; margin: 0 auto; padding: 0 32px; min-height: 80px">
<a href="#top" aria-label="BERI home" style="display: flex; align-items: center; text-decoration: none">
<img src="assets/blob/cff617f74bd4c275aaad6310168f9b41.png" alt="BERI" style="display: block; height: 46px; width: auto">
</a>
<div class="nav-pill" style="border-style: none; background-color: #FFFFFF28; opacity: 1">
<a class="pill-link is-current" href="#top" aria-current="page">Home</a>
<a class="pill-link" href="#pick">Pick yours</a>
<a class="pill-link" href="#compare">Compare</a>
<a class="pill-link" href="#flavors">Flavors</a>
<a class="pill-link" href="#verify">Verify</a>
<a class="pill-cta" href="#wholesale">Wholesale</a>
</div>
</nav>
</header>
</div>

<main id="top">
<section class="wall" aria-label="BERI" style="position: relative; overflow: hidden; margin-top: -104px; min-height: 860px; isolation: isolate">
<div class="hero-tear" aria-hidden="true" style="{{tearRimStyle}}"></div>
<div class="hero-tear grain" aria-hidden="true" style="{{tearPurpleStyle}}"></div>
<div class="hero-tear grain" aria-hidden="true" style="{{tearGreenStyle}}"></div>
<div class="hero-tear grain tear-print" aria-hidden="true" style="{{tearPaperStyle}}"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none">
<sc-for list="{{splats}}" as="sp" hint-placeholder-count="3">
<svg viewBox="0 0 120 120" style="{{sp.style}}"><path d="{{sp.d}}" fill="{{sp.color}}"></path></svg>
</sc-for>
</div>

<div style="position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 170px 32px 120px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 0 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<span style="align-self: flex-start; padding: 6px 14px; border: 2px solid #F4F1EA; font-family: var(--display); font-size: 15px; letter-spacing: 0.24em">PREMIUM DISPOSABLES · ADULTS 21+</span>
<h1 style="margin: 0">
<span style="position: relative; display: inline-block; width: 100%; max-width: 400px">
<img src="assets/blob/cff617f74bd4c275aaad6310168f9b41.png" alt="BERI" style="display: block; width: 100%; height: auto">
<svg aria-hidden="true" viewBox="0 0 96 80" style="position: absolute; right: -22px; top: -48px; width: 84px; height: 70px; transform: rotate(14deg)"><path d="M10 62 L 14 20 L 34 44 L 48 8 L 62 42 L 84 18 L 86 62 Z" fill="none" stroke="#FFD600" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M8 73 C 34 68, 60 71, 90 69" fill="none" stroke="#FFD600" stroke-width="6" stroke-linecap="round"></path><circle cx="48" cy="5" r="4" fill="#FFD600"></circle></svg>
</span>
</h1>
<p class="hero-head" style="margin: 0; font-family: var(--display); font-size: 104px; line-height: 0.9; text-transform: uppercase"><span style="color: #22C3F0">Power.</span><br><span style="position: relative; display: inline-block; color: #3DD683">Pods.<svg aria-hidden="true" viewBox="0 0 300 28" preserveAspectRatio="none" style="position: absolute; left: -2%; bottom: -12px; width: 104%; height: 20px"><path d="M4 18 C 60 8, 120 22, 176 12 S 268 8, 296 15" fill="none" stroke="#FFD600" stroke-width="7" stroke-linecap="round"></path></svg></span><br><span style="color: #A27AF0">Puffs.</span></p>
<p style="margin: 0; max-width: 460px; font-size: 18px; color: #ABA69C">Crush hits 40W. Cliq clicks between 25 refillable pod flavors. Cirql goes up to 150K puffs. One of them is yours.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding-top: 8px">
<a class="btn-solid" href="#pick" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 28px; background: #FFD600; color: #0B0B0D; font-family: var(--display); font-size: 19px; letter-spacing: 0.08em; text-decoration: none">FIND YOUR BERI
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>
</a>
<a class="btn-ghost" href="#verify" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border: 2px solid #F4F1EA; color: #F4F1EA; font-family: var(--display); font-size: 19px; letter-spacing: 0.08em; text-decoration: none">SPOT A FAKE</a>
</div>
</div>

<div style="flex: 1 1 600px; min-width: 0; position: relative; height: 640px">
<div class="hero-note" aria-hidden="true" style="position: absolute; z-index: 4; left: 72%; top: -40px; display: flex; align-items: flex-start; gap: 2px; transform: rotate(-6deg); pointer-events: none">
<span class="marker" style="font-size: 40px; line-height: 1; color: #0B0B0D">new!</span>
<svg viewBox="0 0 80 70" style="width: 74px; height: 64px; margin-top: 18px"><path d="M6 8 C 40 4, 66 18, 62 58" fill="none" stroke="#0B0B0D" stroke-width="5" stroke-linecap="round"></path><path d="M50 46 L 62 60 L 72 44" fill="none" stroke="#0B0B0D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<svg aria-hidden="true" viewBox="0 0 40 40" style="position: absolute; z-index: 4; left: 4%; top: 2%; width: 34px; height: 34px; pointer-events: none"><path d="M20 2 C 21 14, 26 19, 38 20 C 26 21, 21 26, 20 38 C 19 26, 14 21, 2 20 C 14 19, 19 14, 20 2 Z" fill="#FFFFFF"></path></svg>
<svg aria-hidden="true" viewBox="0 0 40 40" style="position: absolute; z-index: 4; left: 40%; bottom: 0; width: 26px; height: 26px; pointer-events: none"><path d="M6 6 L 34 34 M 34 6 L 6 34" fill="none" stroke="#0B0B0D" stroke-width="6" stroke-linecap="round"></path></svg>
<sc-for list="{{heroDevices}}" as="d" hint-placeholder-count="3">
<figure style="{{d.wrapStyle}}">
<img src="{{d.img}}" alt="{{d.alt}}" style="{{d.imgStyle}}">
<figcaption style="{{d.stickerStyle}}">{{d.sticker}}</figcaption>
</figure>
</sc-for>
</div>
</div>
</section>

<svg aria-hidden="true" viewBox="0 0 1440 90" preserveAspectRatio="none" style="display: block; width: 100%; height: 70px; margin-top: -1px; background: #0B0B0D"><path d="{{dripPath}}" fill="#22C3F0"></path></svg>

<div aria-hidden="true" style="position: relative; overflow: hidden; padding: 56px 0 100px; background: #0B0B0D">
<div style="position: absolute; z-index: 0; left: -40px; right: -40px; top: 50%; transform: translateY(-50%) rotate(5deg); background: #F4F1EA; border-top: 3px solid #0B0B0D; border-bottom: 3px solid #0B0B0D">
<div class="tape-r" style="display: flex; width: max-content; gap: 40px; padding: 8px 0; font-family: var(--display); font-size: 21px; letter-spacing: 0.06em; color: #0B0B0D; white-space: nowrap; text-transform: uppercase">
<sc-for list="{{tapeB}}" as="tb" hint-placeholder-count="6"><span>{{tb.t}}</span></sc-for>
</div>
</div>
<div style="position: relative; z-index: 1; transform: rotate(-3deg); margin: 0 -40px; background: #FFD600; border-top: 3px solid #0B0B0D; border-bottom: 3px solid #0B0B0D; box-shadow: 0 8px 18px rgba(0,0,0,0.45)">
<div class="tape-l" style="display: flex; width: max-content; gap: 40px; padding: 12px 0; font-family: var(--display); font-size: 30px; letter-spacing: 0.08em; color: #0B0B0D; white-space: nowrap">
<sc-for list="{{tapeA}}" as="ta" hint-placeholder-count="12"><span>{{ta.t}}</span></sc-for>
</div>
</div>
</div>

<section id="pick" style="scroll-margin-top: 120px; padding: 90px 32px 130px; background: #0B0B0D">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="position: relative; padding-bottom: 28px">
<h2 class="wall-head" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 120px; line-height: 0.88; text-transform: uppercase">Pick your<br>BERI.</h2>
<svg class="tag-wrap" aria-hidden="true" viewBox="0 0 360 190" style="position: absolute; left: 340px; top: 74px; width: 340px; height: auto; overflow: visible; transform: rotate(-8deg); pointer-events: none">
<g class="{{tagCls}}" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path pathLength="1" style="--d: 0s" stroke="#22C3F0" stroke-width="16" d="M40 140 C 38 104, 40 66, 46 30"></path>
<path pathLength="1" style="--d: 0.3s" stroke="#22C3F0" stroke-width="16" d="M44 34 C 96 12, 104 66, 50 82 C 112 78, 110 142, 38 138"></path>
<path pathLength="1" style="--d: 0.7s" stroke="#22C3F0" stroke-width="16" d="M168 34 C 140 30, 124 36, 126 50 C 128 64, 150 74, 162 80 C 132 84, 118 100, 122 118 C 126 134, 150 140, 172 132"></path>
<path pathLength="1" style="--d: 1.1s" stroke="#22C3F0" stroke-width="16" d="M196 140 C 198 104, 200 70, 202 36 C 250 26, 262 74, 208 86 C 230 100, 244 120, 262 142"></path>
<path pathLength="1" style="--d: 1.5s" stroke="#22C3F0" stroke-width="16" d="M292 40 C 290 74, 288 106, 286 140"></path>
<path pathLength="1" style="--d: 1.75s" stroke="#FFD600" stroke-width="6" d="M276 26 L 280 4 L 290 18 L 300 2 L 308 24 Z"></path>
<path pathLength="1" style="--d: 1.95s" stroke="#FFD600" stroke-width="8" d="M18 168 C 110 150, 220 178, 330 152 C 342 149, 352 142, 348 132"></path>
<path pathLength="1" style="--d: 2.3s" stroke="#3DD683" stroke-width="7" d="M330 52 L 350 72 M 350 52 L 330 72"></path>
</g>
</svg>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; max-width: 400px">
<img class="pick-cans" src="assets/blob/3db62c54dcf800304a7beab892bebb42.webp" alt="" aria-hidden="true" style="display: block; width: 250px; height: auto; transform: rotate(7deg); filter: drop-shadow(12px 18px 16px rgba(0,0,0,0.6))">
<p style="margin: 0; font-size: 18px; color: #ABA69C">Tell us what matters most and we will point you to the one built for it.</p>
</div>
</div>
<div role="group" aria-label="What matters most" style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{pickBtns}}" as="pb" hint-placeholder-count="3">
<button type="button" class="pick-btn" aria-pressed="{{pb.pressed}}" onClick="{{pb.pick}}" style="{{pb.style}}"><span style="font-size: 14px; letter-spacing: 0.24em; opacity: 0.8">I WANT</span>{{pb.label}}</button>
</sc-for>
</div>
<article class="grain match-grid paper-tex" aria-live="polite" style="{{matchStyle}}">
<span class="ghost-name" aria-hidden="true" style="position: absolute; z-index: 0; right: -24px; bottom: -70px; font-family: 'GraffitiBomb Outline', var(--display); font-size: 330px; line-height: 1; letter-spacing: -0.04em; color: rgba(11,11,13,0.2); white-space: nowrap; pointer-events: none; transform: rotate(-6deg)">{{match.name}}</span>
<div style="position: relative; z-index: 1; box-sizing: border-box; padding: 56px 48px; display: flex; flex-direction: column; gap: 18px">
<span style="align-self: flex-start; padding: 4px 12px; background: #0B0B0D; color: #F4F1EA; font-family: var(--display); font-size: 16px; letter-spacing: 0.24em">YOUR MATCH</span>
<h3 class="match-name" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 180px; line-height: 0.8; text-transform: uppercase">{{match.name}}</h3>
<p style="margin: 0; max-width: 460px; font-size: 19px; font-weight: 600; line-height: 1.45">{{match.why}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px">
<sc-for list="{{match.stats}}" as="st" hint-placeholder-count="4">
<span style="{{st.style}}">{{st.t}}</span>
</sc-for>
</div>
<a class="match-cta" href="#compare" style="align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; background: #0B0B0D; color: #F4F1EA; font-family: var(--display); font-size: 19px; letter-spacing: 0.06em; text-decoration: none">{{match.cta}}</a>
</div>
<div style="position: relative; z-index: 1; min-height: 560px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" viewBox="0 0 120 120" style="position: absolute; width: 860px; height: 860px; max-width: none; opacity: 0.95; transform: rotate(-12deg)"><path d="{{match.splatD}}" fill="{{match.splat}}"></path></svg>
<img class="match-dev match-img" src="{{match.img}}" alt="{{match.alt}}" style="{{match.imgStyle}}">
</div>
</article>
</div>
</section>

<section id="compare" class="wall" style="scroll-margin-top: 120px; padding: 110px 32px 130px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<h2 class="wall-head" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 120px; line-height: 0.88; text-transform: uppercase">Side<br>by side.</h2>
<p style="margin: 0; max-width: 400px; font-size: 18px; color: #ABA69C">The numbers, straight. No fine print.</p>
</div>
<div style="position: relative">
<span class="slap" aria-hidden="true" style="right: -14px; top: -30px; padding: 10px 16px; background: #FFFFFF; font-size: 24px; transform: rotate(7deg)">100% REAL</span>
<span class="slap" aria-hidden="true" style="left: -30px; top: -36px; width: 76px; height: 76px; border-radius: 50%; background: #22C3F0; font-size: 28px; transform: rotate(-12deg)">21+</span>
<div style="overflow-x: auto; border: 3px solid #F4F1EA; background: #0B0B0D; box-shadow: 10px 10px 0 #FFD600">
<div role="table" aria-label="BERI devices compared" style="min-width: 760px">

    const moodList = [['all', 'ALL', '#F4F1EA'], ['icy', 'ICY', '#7FD4FF'], ['mint', 'MINT', '#3DD683'], ['fruit', 'FRUIT & CANDY', '#FFD600']];
    const shown = pods.filter((p) => this.state.mood === 'all' || p[2] === this.state.mood);
    // Hand-placed, uneven tilts and tape so the wall does not read as a pattern.
    const tilt = [-2.5, 1.5, -1, 3, -3, 0.5, -1.5, 2.5, -0.5, 1];
    const tape = [[-4, 50], [3, 38], [-2, 62], [5, 45], [-6, 55], [2, 50], [-3, 40], [4, 58], [-1, 48], [6, 52]];

    const steps = [
      ['1', 'Find the label', 'Look for the security label on the outside of the box.', '#FFD600', -1.5],
      ['2', 'Scratch it', 'Scratch off the coating to show the code underneath.', '#3DD683', 1],
      ['3', 'Enter the code', 'Type it in. Real or fake, you will know in seconds.', '#A27AF0', -0.5]
    ];

    return {
      tagCls: 'tag-draw' + (this.state.tagOn ? ' is-drawn' : ''),
      navStyle: 'padding: 12px 0; transition: background 0.3s ease; background: ' + (this.state.scrolled ? 'linear-gradient(180deg, rgba(11,11,13,0.85) 0%, rgba(11,11,13,0) 100%)' : 'transparent'),
      tearRimStyle: tearBase + 'width: 56%; background: #FFFFFF; clip-path: ' + ragged(7, 5),
      tearPurpleStyle: tearBase + 'width: 54.8%; background-color: #A27AF0; clip-path: ' + ragged(29, 4.5),
      tearGreenStyle: tearBase + 'width: 53.5%; background-color: #3DD683; clip-path: ' + ragged(41, 4),
      tearPaperStyle: tearBase + 'width: 52.2%; background-color: #22C3F0; clip-path: ' + ragged(19, 4),
      // Hand-sprayed paint splats on the black side: [left, top, size, colour, turn].
      splats: [['29%', '60px', 210, '#3DD683', 0], ['24%', '40%', 160, '#FFD600', 40], ['30%', '74%', 190, '#A27AF0', -30]].map((p, i) => ({
        color: p[3],
        d: splatShapes[i],
        style: 'position: absolute; left: ' + p[0] + '; top: ' + p[1] + '; width: ' + p[2] + 'px; height: ' + p[2] + 'px; opacity: 0.85; transform: rotate(' + p[4] + 'deg)'
      })),
      heroDevices: [
        { img: 'assets/blob/6b23305e8b326499a72d8dcd66229029.webp', alt: 'BERI Cliq in Blue Rancher', sticker: '25 FLAVORS', bg: '#3DD683', x: 31, y: 61, h: 380, r: -13, sr: 6, sx: '18px', sy: '86%', left: true },
        { img: 'assets/blob/ad8952b79bf25e8fb5dcbb19894d0676.webp', alt: 'BERI Crush in Mango Bomb', sticker: '40W', bg: '#FFD600', x: 56, y: 43, h: 420, r: 10, sr: -6, sx: '-34px', sy: '6%' },
        { img: 'assets/blob/46b915155efdf5133066bf9bc843675e.webp', alt: 'BERI Cirql in Lady Killer red', sticker: '150K PUFFS', bg: '#FFFFFF', x: 89, y: 57, h: 490, r: -8, sr: 4, sx: '-64px', sy: '34%' }
      ].map((d, i) => ({
        img: d.img,
        alt: d.alt,
        sticker: d.sticker,
        wrapStyle: 'position: absolute; z-index: ' + (i === 1 ? 3 : 2) + '; left: ' + d.x + '%; top: ' + d.y + '%; margin: 0; transform: translate(-50%, -50%) rotate(' + d.r + 'deg)',
        imgStyle: 'display: block; height: ' + d.h + 'px; width: auto; filter: drop-shadow(14px 24px 18px rgba(0,30,45,0.42))',
        stickerStyle: 'position: absolute; ' + (d.left ? 'left: ' : 'right: ') + d.sx + '; top: ' + d.sy + '; padding: 3px 10px; border: 2px solid #0B0B0D; background: ' + d.bg + '; color: #0B0B0D; font-family: var(--display); font-size: 20px; letter-spacing: 0.04em; white-space: nowrap; transform: rotate(' + d.sr + 'deg)'
      })),
      dripPath: dripPath,
      tapeA: tapeWords.concat(tapeWords).concat(tapeWords).map((t) => ({ t: t })),
      // Second tape behind the yellow one, running the other way with the nicotine warning.
      tapeB: [0, 1, 2, 3, 4, 5].map(() => ({ t: 'WARNING: This product contains nicotine. Nicotine is an addictive chemical.  ✕' })),

      pickBtns: devices.map((d, i) => {
        const on = i === this.state.pick;
        return {
          label: d.want,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ pick: i }),
          style: 'display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 76px; padding: 12px 26px; cursor: pointer; font-family: var(--display); font-size: 28px; letter-spacing: 0.04em; line-height: 1.05; text-align: left; border: 3px solid ' + d.color + '; background: ' + (on ? d.color : 'transparent') + '; color: ' + (on ? '#0B0B0D' : d.color) + '; box-shadow: ' + (on ? '6px 6px 0 #F4F1EA' : 'none')
        };
      }),
      matchStyle: 'position: relative; overflow: hidden; box-sizing: border-box; background-color: ' + cur.color + '; color: #0B0B0D; clip-path: ' + tornTop + '; transition: background-color 0.35s ease',
      match: {
        name: cur.name,
        why: cur.why,
        img: cur.img,
        alt: cur.alt,
        splat: cur.splat,
        splatD: splatShapes[3 + (this.state.pick % 3)],
        cta: 'COMPARE ALL THREE →',
        imgStyle: '--r: ' + cur.r + 'deg; position: relative; display: block; height: 470px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(16px 26px 20px rgba(0,0,0,0.38))',
        stats: cur.stats.map((t, i) => ({
          t: t,
          style: 'display: inline-block; padding: 6px 12px; border: 2px solid #0B0B0D; background: ' + (i === 0 ? '#0B0B0D' : '#F4F1EA') + '; color: ' + (i === 0 ? cur.color : '#0B0B0D') + '; font-family: var(--display); font-size: 18px; letter-spacing: 0.04em; transform: rotate(' + [-1.5, 1, -0.5, 1.5][i % 4] + 'deg)'
        }))
      },

      cmpHead: devices.map((d) => ({
        name: d.name,
        style: 'display: inline-block; padding: 4px 14px; background: ' + d.color + '; color: #0B0B0D; font-family: var(--display); font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; transform: rotate(-2deg)'
      })),
      cmpRows: cmp.map((r) => ({
        label: r[0],
        cells: r.slice(1).map((t, i) => ({
          t: t,
          style: 'padding: 20px 28px; font-size: 18px; font-weight: 600; color: ' + (t.charAt(0) === '[' || t === '–' ? '#6E6A62' : '#F4F1EA') + (this.state.pick === i ? '; background: rgba(255,255,255,0.04)' : '')
        }))
      })),

      moods: moodList.map((m) => {
        const on = this.state.mood === m[0];
        return {
          label: m[1],
          count: String(m[0] === 'all' ? pods.length : pods.filter((p) => p[2] === m[0]).length),
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ mood: m[0] }),
          style: 'min-height: 52px; padding: 0 22px; cursor: pointer; font-family: var(--display); font-size: 20px; letter-spacing: 0.08em; border: 2px solid ' + (on ? m[2] : '#3A3A42') + '; background: ' + (on ? m[2] : 'transparent') + '; color: ' + (on ? '#0B0B0D' : '#F4F1EA')
        };
      }),
      pods: shown.map((p, i) => ({
        name: p[0],
        img: p[1],
        alt: 'BERI Cliq pod in ' + p[0],
        style: 'position: relative; margin: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 14px; background: #FFFFFF; box-shadow: 0 10px 18px rgba(0,0,0,0.5); transform: rotate(' + tilt[i % tilt.length] + 'deg)',
        tapeStyle: 'position: absolute; left: ' + tape[i % tape.length][1] + '%; top: -11px; width: 70px; height: 22px; transform: translateX(-50%) rotate(' + tape[i % tape.length][0] + 'deg); background: rgba(239,230,214,0.85)'
      })),

      steps: steps.map((s) => ({
        n: s[0],
        title: s[1],
        text: s[2],
        style: 'position: relative; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 32px 30px 36px; background: #0B0B0D; border: 2px dashed #3A3A42; transform: rotate(' + s[4] + 'deg)',
        numStyle: 'font-family: var(--tag-fill); font-size: 120px; line-height: 0.9; color: ' + s[3] + '; -webkit-text-stroke: 2px #0B0B0D; text-shadow: 5px 5px 0 #F4F1EA'
      })),

      wsShop: this.state.wsShop,
      wsCity: this.state.wsCity,
      onShop: (e) => this.setState({ wsShop: e.target.value }),
      onCity: (e) => this.setState({ wsCity: e.target.value }),
      sendWs: (e) => {
        e.preventDefault();
        const shop = this.state.wsShop.trim();
        const city = this.state.wsCity.trim();
        const subject = 'Wholesale request' + (shop ? ': ' + shop : '');
        const body = 'Shop: ' + (shop || '-') + '\nCity: ' + (city || '-') + '\n\nWe would like wholesale pricing for BERI Crush, Cliq and Cirql.';
        window.location.href = 'mailto:wholesale@beridisposable.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
    };
  }
}
</script>
<script src="assets/js/beri-runtime.js"></script>
</body>
